# Run the public suite before scanning both available history and working files.
name: Secrets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          checksums="gitleaks_${version}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          install_dir="$(mktemp -d "${RUNNER_TEMP}/gitleaks.XXXXXX")"
          cd "$install_dir"
          curl --fail --silent --show-error --location "$base/$archive" --output "$archive"
          curl --fail --silent --show-error --location "$base/$checksums" --output "$checksums"
          # Verify exactly the downloaded asset against this release's checksum file.
          grep -E "^[0-9a-f]{64}  ${archive//./\\.}$" "$checksums" > selected-checksum.txt
          sha256sum --check --strict selected-checksum.txt
          tar -xzf "$archive" gitleaks
          chmod 0755 gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Run the public test suite
        id: tests
        run: python3 -m unittest discover -s tests -v

      - name: Scan all available Git history
        run: gitleaks git --config .gitleaks.toml --redact --log-opts=--all .

      - name: Scan the working tree even if the history scan failed
        # Do not bypass failed installation/tests, or mask the history scan's failure.
        if: always() && steps.tests.outcome == 'success'
        run: gitleaks dir --config .gitleaks.toml --redact .
